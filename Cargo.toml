[package]
name = "deepseek-web-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Minimal MCP server exposing DeepSeek Web Search and Fetch APIs"
license = "MIT"
repository = "https://github.com/zhuzhda/deepseek-web-mcp"
homepage = "https://github.com/zhuzhda/deepseek-web-mcp"
readme = "README.md"
keywords = ["mcp", "deepseek", "web-search", "search"]
categories = ["development-tools", "web-programming"]

[[bin]]
name = "deepseek-web-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

# Small, static, fast-starting binary
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# `cargo binstall deepseek-web-mcp` -> prebuilt release archives
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(unix)']
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"
