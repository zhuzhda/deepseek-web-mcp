name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: CLI smoke test
        run: |
          ./target/release/deepseek-web-mcp --version
          ./target/release/deepseek-web-mcp --help | head -n 3
          ./target/release/deepseek-web-mcp --bogus && exit 1 || test $? -eq 2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: CLI smoke test
        run: |
          cargo build --release
          .\target\release\deepseek-web-mcp.exe --version
          .\target\release\deepseek-web-mcp.exe --help | Select-Object -First 3

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89" # keep in sync with Cargo.toml `rust-version`

      - uses: Swatinem/rust-cache@v2

      - name: Build (MSRV)
        run: cargo build --locked
